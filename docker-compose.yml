# Siren local stack.
# Quickstart: cp .env.example .env && docker compose up
# Attacker:   docker compose run --rm attacker
# .env is optional: with no .env, SIREN_LLM falls back to mock (no API key needed).

networks:
  internal:   # decoy <-> gateway only. No internet egress, no published ports.
    internal: true
  web:        # gateway + dashboard. Carries the published ports.
  attack:     # attacker -> gateway only. Not internal, so ATTACKER_MODE=llm can reach the LLM API.

services:
  decoy:
    build: ./decoy
    networks: [internal]
    restart: unless-stopped

  gateway:
    # Repo-root context so the image includes shared/ (contracts + events).
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"   # HTTP: proxy to decoy, or maze once flagged
      - "8090:8090"   # WebSocket event stream for the dashboard
    env_file:
      - path: .env
        required: false
    environment:
      DECOY_URL: http://decoy
      REPLAY_DIR: /replays   # matches the volume below, so replays land in ./replays on the host
    depends_on: [decoy]
    networks: [internal, web, attack]
    volumes:
      - ./replays:/replays
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "5173:5173"
    networks: [web]
    restart: unless-stopped

  attacker:
    build:
      context: .
      dockerfile: attacker/Dockerfile
    profiles: [attack]   # only runs via: docker compose run --rm attacker
    networks: [attack]   # can reach gateway, not decoy or dashboard
    env_file:
      - path: .env
        required: false
    environment:
      TARGET_URL: http://gateway:8080
    depends_on: [gateway]
