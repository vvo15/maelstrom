<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php index.html

    # DECOY_HEADERS — must match shared/contracts.ts DECOY_HEADERS exactly
    Header always set Server "Apache/2.4.62 (Debian)"
    Header always set X-Powered-By "PHP/8.3.12"
    # Remove headers Apache adds automatically that would break the illusion
    Header unset X-Content-Type-Options

    <Directory /var/www/html/public>
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    # Route everything through index.php for clean URLs
    FallbackResource /index.php

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
