# Server banner = "Apache/<version> (Debian)". Must match DECOY_HEADERS.server.
ServerTokens OS
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php

    <Directory /var/www/html/public>
        AllowOverride None
        Options -Indexes
        Require all granted
    </Directory>

    # Every path (including /.env, /robots.txt, /backup/*) goes through the router.
    FallbackResource /index.php

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
